<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>09.03 Lab - JavaScript in the Browser</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <h1>Starting Lineup</h1>

  <form id="lineup">

    <p>
      <fieldset>
        <legend>Status:</legend>
        <input type="radio" id="DraftOption" name="status" value="Draft">
        <label for="DraftOption">Draft</label>
        <input type="radio" id="FinalOption" name="status" value="Final" checked>
        <label for="FinalOption">Final</label>
      </fieldset>
    </p>

    <p>
      <label for="date">Date:</label>
      <select name="date" id="date">
        <option value="m20">March 20</option>
        <option value="m24">March 24</option>
        <option value="a2">April 2</option>
        <option value="a6">April 6</option>
        <option value="a13">April 13</option>
      </select>
    </p>

    <p>
      <fieldset>
        <legend>Players:</legend>
        <input type="checkbox" id="PlayerAarav" name="players" value="Aarav">
        <label for="PlayerAarav">Aarav Agarwal</label><br>
        <input type="checkbox" id="PlayerAva" name="players" value="Ava">
        <label for="PlayerAva">Ava Johnson</label><br>
        <input type="checkbox" id="PlayerJulio" name="players" value="Julio">
        <label for="PlayerJulio">Julio Ortiz</label><br>
        <input type="checkbox" id="PlayerLiam" name="players" value="Liam">
        <label for="PlayerLiam">Liam Rubio</label><br>
        <input type="checkbox" id="PlayerEmma" name="players" value="Emma">
        <label for="PlayerEmma">Emma Witherspoon</label>
      </fieldset>
    </p>

    <p>
      <input type="submit" id="SubmitButton" value="Submit">
    </p>

  </form>

</body>

</html>
